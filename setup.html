<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topfschlagen Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; background: #F8F8F4; padding: 40px; text-align: center; }
        .btn { display: block; width: 100%; padding: 20px; margin: 10px 0; border: 1px solid #777; background: white; cursor: pointer; border-radius: 4px; }
        .btn:active { background: #E0E0E0; }
        #status { color: #888; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Punkt Speichern</h2>
    <button class="btn" onclick="savePoint(0)">Punkt A (Ocker) hier speichern</button>
    <button class="btn" onclick="savePoint(1)">Punkt B (Grün) hier speichern</button>
    <button class="btn" onclick="savePoint(2)">Punkt C (Weinrot) hier speichern</button>
    <div id="status">Warte auf GPS...</div>

    <script>
        let currentPos = null;

        navigator.geolocation.watchPosition(pos => {
            currentPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            document.getElementById('status').innerText = `Aktuell: ${currentPos.lat.toFixed(6)}, ${currentPos.lon.toFixed(6)}`;
        }, err => console.error(err), { enableHighAccuracy: true });

        function savePoint(index) {
            if (!currentPos) return alert("Noch kein GPS-Signal!");
            let saved = JSON.parse(localStorage.getItem('gpsPoints')) || [null, null, null];
            saved[index] = currentPos;
            localStorage.setItem('gpsPoints', JSON.stringify(saved));
            alert(`Punkt ${index + 1} gespeichert!`);
        }
    </script>
</body>
</html>
