<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Klangwelten</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; background: #F8F8F4; font-family: 'IBM Plex Sans', sans-serif; }
    
    /* Hotbar erst unsichtbar, wird nach Start gezeigt */
    #hotbar {
      position: fixed; top: 0; left: 0; width: 100%; height: 60px;
      background: #E0E0E0; display: none; align-items: center; padding: 0 20px;
      box-sizing: border-box; z-index: 10;
    }
    
    .toggle-container { display: flex; border: 1px solid #777; border-radius: 4px; overflow: hidden; }
    
    .toggle-btn { 
      background: none; border: none; padding: 8px 16px; 
      font-size: 14px; color: #555; cursor: pointer; font-family: inherit;
    }
    
    .toggle-btn.active { background: #777; color: white; }
  </style>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <div id="hotbar">
    <div class="toggle-container">
      <button id="fix3" class="toggle-btn active">fix3</button>
      <button id="var3" class="toggle-btn">var3</button>
    </div>
  </div>
</body>
</html>
